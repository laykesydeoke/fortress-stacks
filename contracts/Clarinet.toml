[project]
name = 'fortress-stacks'
description = 'FortressStacks - Institutional Bitcoin Treasury Command Center'
authors = []
telemetry = true
cache_dir = './.cache'
requirements = []

[contracts.sbtc-token]
path = 'contracts/sbtc-token.clar'
clarity_version = 4
epoch = 'latest'

[contracts.payment-processor]
path = 'contracts/payment-processor.clar'
clarity_version = 4
epoch = 'latest'

[contracts.treasury-manager]
path = 'contracts/treasury-manager.clar'
clarity_version = 4
epoch = 'latest'

[contracts.yield-strategy]
path = 'contracts/yield-strategy.clar'
clarity_version = 4
epoch = 'latest'
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
